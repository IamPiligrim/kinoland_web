<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var kinolandTheme = localStorage.getItem('kinoland-theme')
        if (kinolandTheme === 'light' || kinolandTheme === 'dark') {
          document.documentElement.setAttribute('data-theme', kinolandTheme)
        }
      } catch (error) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12191a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4efe3" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="«Киноленд» в Калининграде: расписание сеансов, кафе «Марио» с доставкой и банкетный зал. Киевская, 71."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@600..700&family=Onest:wght@400..700&display=swap"
    />
    <title>Киноленд — кино, кафе и банкеты в Калининграде</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
